name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile app.py ingestao.py logger.py run.py test_alucinacao.py test_extracao.py

      - name: Run hallucination tests
        run: python test_alucinacao.py

      - name: Run extraction tests
        run: |
          python -c "
from test_extracao import *
test_limpar_texto_remove_paginacao()
test_limpar_texto_remove_confidencial()
test_ok()
print('Todos os testes de extracao passaram')
"

      - name: Verify config.yaml loads
        run: |
          python -c "
import yaml
with open('config.yaml', 'r', encoding='utf-8') as f:
    config = yaml.safe_load(f)
assert config['modelo_llm'] == 'llama3.1:8b'
assert config['modelo_embedding'] == 'paraphrase-multilingual-MiniLM-L12-v2'
print('config.yaml valido')
"