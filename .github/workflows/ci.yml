name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile app.py config.py index.py embeddings/provider.py vectorstore/pinecone_client.py rag/retriever.py rag/chain.py test_alucinacao.py test_extracao.py

      - name: Run hallucination tests
        run: python test_alucinacao.py

      - name: Run extraction tests
        run: |
          python -c "
          from test_extracao import *
          test_limpar_texto_remove_paginacao()
          test_limpar_texto_remove_confidencial()
          test_ok()
          print('Todos os testes de extracao passaram')
          "

      - name: Verify config loads
        run: |
          python -c "
          from config import get_config
          c = get_config()
          assert c.groq.model
          assert c.embedding.dimension == 384
          assert c.pinecone.index_name
          print('config OK:', c.groq.model, '| dim:', c.embedding.dimension, '| index:', c.pinecone.index_name)
          "
