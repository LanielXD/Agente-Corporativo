# ──────────────────────────────────────────────
# MODELO DE LINGUAGEM (LLM)
# ──────────────────────────────────────────────

# Modelo utilizado para gerar respostas (via Ollama)
modelo_llm: "llama3.2:1b"

# Temperatura do modelo (0.0 = preciso, 1.0 = criativo)
temperatura_llm: 0.1

# ──────────────────────────────────────────────
# MODELO DE EMBEDDING (vetores semânticos)
# ──────────────────────────────────────────────

# Modelo para converter textos em vetores e buscar similaridade
modelo_embedding: "paraphrase-multilingual-MiniLM-L12-v2"

# ──────────────────────────────────────────────
# CHUNKS — divisão dos documentos
# ──────────────────────────────────────────────

# Número máximo de caracteres por bloco de texto
chunk_tamanho: 500

# Sobreposição entre blocos consecutivos (evita perda de contexto)
chunk_sobreposicao: 50

# ──────────────────────────────────────────────
# BUSCA — quantidade de documentos retornados
# ──────────────────────────────────────────────

# Número de documentos buscados para cada pergunta
qtd_documentos: 5

# ──────────────────────────────────────────────
# RERANKER — reordenação dos resultados
# ──────────────────────────────────────────────

# Modelo para reordenar os resultados da busca semântica (cross-encoder multilíngue)
modelo_reranker: "BAAI/bge-reranker-base"

# Se false, pula o reranking (usa apenas similaridade de cosseno)
usar_reranker: true

# ──────────────────────────────────────────────
# RESPONSÁVEIS — contatos por departamento
# ──────────────────────────────────────────────

responsaveis:
  rh: "Maria Oliveira"
  financeiro: "João Santos"
  juridico: "Dra. Ana Costa"

curadoria:
  # Arquivos cujo nome contém estes termos são ignorados
  ignorar_se_conter:
    - "rascunho"
    - "draft"
    - "old"
    - "test"
    - "tmp"
    - "copia"
    - "backup"
  # Arquivos com nome exato ignorados (case-insensitive)
  ignorar_exatos:
    - "notas.md"
    - "README.md"
    - "pessoal.txt"
    - "anotacoes.txt"
  # Se true, mantém apenas a versão sem sufixo de versão (ex: "politica_v2.pdf" ignora se "politica.pdf" existe)
  manter_versao_oficial: true


