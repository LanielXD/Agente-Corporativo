# ──────────────────────────────────────────────
# MODELO LLM — via Groq API (grátis, rápido)
# ──────────────────────────────────────────────
modelo_llm: "llama-3.1-8b-instant"
temperatura_llm: 0.1
max_tokens_llm: 4096
# Chave GROQ_API_KEY deve ser definida nas variáveis de ambiente / Streamlit Secrets

# ──────────────────────────────────────────────
# EMBEDDINGS — modelo leve 6 layers (fallback automático para HF API se local falhar)
# ──────────────────────────────────────────────
modelo_embedding: "sentence-transformers/paraphrase-MiniLM-L6-v2"

# ──────────────────────────────────────────────
# CHUNKS — chunks maiores = menos chunks = busca mais rápida
# ──────────────────────────────────────────────
chunk_tamanho: 600
chunk_sobreposicao: 60

# ──────────────────────────────────────────────
# BUSCA — menos docs = prompt menor = LLM mais rápido
# ──────────────────────────────────────────────
qtd_documentos: 3

# ──────────────────────────────────────────────
# RERANKER — desativado por performance
# ──────────────────────────────────────────────
modelo_reranker: "BAAI/bge-reranker-base"
usar_reranker: false

# ──────────────────────────────────────────────
# RESPONSÁVEIS — contatos por departamento
# ──────────────────────────────────────────────

responsaveis:
  rh: "Maria Oliveira"
  financeiro: "João Santos"
  juridico: "Dra. Ana Costa"

curadoria:
  # Arquivos cujo nome contém estes termos são ignorados
  ignorar_se_conter:
    - "rascunho"
    - "draft"
    - "old"
    - "test"
    - "tmp"
    - "copia"
    - "backup"
  # Arquivos com nome exato ignorados (case-insensitive)
  ignorar_exatos:
    - "notas.md"
    - "README.md"
    - "pessoal.txt"
    - "anotacoes.txt"
  # Se true, mantém apenas a versão sem sufixo de versão (ex: "politica_v2.pdf" ignora se "politica.pdf" existe)
  manter_versao_oficial: true


